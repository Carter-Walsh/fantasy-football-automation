name: Fantasy Pipeline (manual)

# Runs automatically every Tuesday, and can also be triggered manually from
# the GitHub mobile app (Actions tab -> this workflow -> Run workflow) or a
# phone Shortcut hitting the GitHub API's workflow dispatch endpoint.
on:
  workflow_dispatch: {}
  schedule:
    # 12:00 UTC every Tuesday = 8:00am ET (EDT) / 7:00am ET (EST during
    # standard time). Adjust the hour below if you want a different local time
    # — GitHub Actions cron is always UTC and does not shift for daylight saving.
    - cron: "0 12 * * 2"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests nflreadpy pandas pyarrow

      - name: Pull nflverse data (shared across all leagues)
        run: python scripts/fetch_nflverse.py

      - name: Pull + merge — Threat Level Monday Night (redraft)
        run: |
          python scripts/fetch_sleeper.py --league-id 1370995280203223040 --output output/sleeper_redraft.json
          python scripts/merge.py --sleeper output/sleeper_redraft.json --output output/latest_redraft.json

      - name: Pull + merge — Dynasty league
        run: |
          python scripts/fetch_sleeper.py --league-id 1326626001475633152 --output output/sleeper_dynasty.json
          python scripts/merge.py --sleeper output/sleeper_dynasty.json --output output/latest_dynasty.json

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest_redraft.json output/latest_dynasty.json output/sleeper_redraft.json output/sleeper_dynasty.json output/nflverse.json output/players_cache.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update fantasy data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
